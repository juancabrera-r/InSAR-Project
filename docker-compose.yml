
services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: insar_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: insar
      POSTGRES_USER: insar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insar -d insar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
