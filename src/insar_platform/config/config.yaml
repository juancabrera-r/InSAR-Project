
# Configuration file for the InSAR project

# General configuration for the InSAR project
DEBUG_MODE: true

# Copernicus Data Catalogue URL
URL: "https://catalogue.dataspace.copernicus.eu"

# Date range for the acquisitions in UTC
START_DATE: "2025-01-01 00:00:00"
END_DATE: "2025-03-01 00:00:00"
# END_DATE: "2026-01-01 00:00:00"

SAR_PARAMETERS:
  PLATFORM: "A"
  ORBIT_DIRECTION: "ASCENDING"
  RELATIVE_ORBIT: 1
  SWATH: "IW3"

COPERNICUS_PRODUCT:
  AREA: "geography"
  PARENTPRODUCTTYPE: "IW_SLC__1S"
  POLARIZATION: "VV"

AOI_GEOJSON: "data/aoi/alto_guadalentin_processing.geojson"

# Catalogue burst ID for the acquisitions debug
CATALOGUE_BURST_ID: 219

# Fingerprint for the bursts
BURSTS_FINGERPRINT: "98344c1142d741fb0db99cfa7c2e82652b34002a7040934fb03ce047ed42dd65"

# Validation
MAX_INVALID_NONZERO_FRACTION: 0.05

# Paths
ANNOTATION_DATA_RAW: "data/raw/annotation"
MEASUREMENT_DATA_RAW: "data/raw/measurement"