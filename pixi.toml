[workspace]
authors = ["juanmanuel.cabrera"]
channels = ["conda-forge"]
name = "insar-platform"
platforms = ["win-64", "linux-64"]
version = "0.1.0"

[dependencies]
python = "3.12.*"
rich = "*"
pyyaml = ">=6.0.3,<7"
python-dotenv = ">=1.2.4,<2"
requests = ">=2.34.2,<3"
pip = ">=26.2.1,<27"
shapely = ">=2.2.0,<3"
pyproj = ">=3.8.0,<4"
scipy = ">=1.18.1,<2"
rasterio = ">=1.5.2,<2"
matplotlib = ">=3.11.2,<4"

sqlalchemy = ">=2.0,<3"
psycopg = ">=3.2,<4"
alembic = ">=1.16,<2"
geoalchemy2 = ">=0.17,<1"

[pypi-dependencies]
insar-platform = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = "*"
ruff = "*"
pre-commit = "*"

[feature.dev.pypi-dependencies]
debugpy = ">=1.8.22, <2"

[tasks]
insar = "python -m insar_platform.app.main"
test = "python -m pytest tests/unit -v"
validation = "python -m pytest tests/scientific -v -s"
format = "ruff format ."
format-check = "ruff format --check ."
lint = "ruff check ."

[environments]
dev = { features = ["dev"], solve-group = "default" }
